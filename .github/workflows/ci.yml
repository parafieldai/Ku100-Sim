name: Validate native renderer and viewer

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned browser test dependency
        run: npm ci --prefix web
      - name: Install browser for end-to-end validation
        run: npx --prefix web playwright install --with-deps chromium
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Install optional offline texture optimizer
        run: python -m pip install -r requirements-texture.txt
      - name: Build native renderer
        run: python scripts/build_native.py
      - name: Verify source bank
        run: python scripts/prepare_ku100.py --download
      - name: Test native model and export contracts
        run: python -m unittest discover -s tests -v
      - name: Test viewer contracts
        run: npm --prefix web test
      - name: Check research documentation and preserved evidence
        run: python scripts/check_research_index.py
      - name: Verify physical refinement and regime checks
        run: python scripts/validate_physics.py --out validation/local/physics-convergence.json
      - name: Validate analytical unsteady tube impedance
        run: python scripts/validate_viscous.py
      - name: Assess per-ear and per-band convergence without hiding weak bands
        run: python scripts/quality_gate.py
      - name: Validate the alternative pressure-release source
        run: python scripts/validate_release.py
      - name: Generate deterministic demonstration exports
        run: python scripts/generate_examples.py
      - name: Build the saved six-candidate acoustic comparison
        run: python scripts/build_target_study.py
      - name: Record target limitations without claiming acceptance
        run: python scripts/assess_target_study.py
      - name: Render revised source textures and same-spectrum controls
        run: python scripts/build_texture_iteration.py
      - name: Measure source iteration without claiming target acceptance
        run: python scripts/assess_texture_iteration.py
      - name: Verify generated bundles against the browser contract
        run: npm --prefix web run check:examples
      - name: Validate publication allowlist and build static site
        run: python scripts/build_site.py
      - name: Exercise real rendered audio and import in Chromium
        run: node scripts/browser_e2e.mjs
      - name: Package server-free preview and original WAV downloads
        run: python scripts/package_preview.py --out outputs/review
      - name: Exercise the offline preview in Chromium
        run: node scripts/browser_offline.mjs
      - name: Test the reference-first comparison over HTTP
        run: node scripts/browser_target.mjs
      - name: Test the generated-only target comparison offline
        env:
          KU100_TARGET_URL: file://${{ github.workspace }}/outputs/review/target.html
          KU100_TARGET_REPORT_DIR: validation/local/target-offline
        run: node scripts/browser_target.mjs
      - name: Test saved comparison playback and local-only reference handling
        run: node scripts/browser_saved_listening.mjs
      - name: Verify stereo-only source playback and reference privacy
        run: node scripts/browser_source.mjs
      - name: Render fresh 12-second variations and the 30-second assembly
        run: python scripts/build_long_examples.py --out web/long/generated
      - name: Append the validated longer listening page without publishing references
        run: python scripts/package_long_site.py
      - name: Verify longer audio decoding, playback, seeking and downloads
        run: node scripts/browser_long.mjs
      - name: Generate distinct data-assisted object tapping sounds
        run: python scripts/build_object_examples.py
      - name: Publish only the validated generated object files
        run: python scripts/package_object_site.py
      - name: Verify real object-audio playback and downloads
        run: node scripts/browser_objects.mjs
      - name: Check shared-engine trajectory refinement and state behavior
        run: python scripts/validate_unified.py
      - name: Generate seven scenes through the single mechanical engine
        run: python scripts/build_unified_examples.py
      - name: Enforce measured binaural receiver and reject mono object previews
        run: python scripts/validate_binaural.py
      - name: Package the bounded shared-engine extension
        run: python scripts/package_unified_site.py
      - name: Verify common-engine audio, traces and scene export
        run: node scripts/browser_unified.mjs
      - name: Generate the connected contact scene and preserve fork-field configurations
        run: |
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python scripts/build_hand_scene.py
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python scripts/validate_hand_scene.py --out web/hand/generated/refinement.json
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python scripts/build_fork_radiation.py --out web/fork-radiation/generated
          python scripts/validate_fork_radiation.py --out validation/local/fork-radiation.json
      - name: Package contact research without raw measurement recordings
        run: python scripts/package_hand_site.py
      - name: Exercise the new contact and fork pages over ordinary HTTP
        run: node scripts/browser_contact.mjs
      - name: Retain tested native examples and verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ku100-verified-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/
            outputs/review/
            validation/local/
            validation/physics-convergence.json
            build/ku100-native.build.json
