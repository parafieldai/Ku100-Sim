name: Validate coupled body interactions
on:
  push:
    branches: [body-pair-interactions]
    paths: ['.interaction-part2', '.github/workflows/check-body-interactions.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: body-interaction-validation
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'parafieldai/Ku100-Sim' && github.ref == 'refs/heads/body-pair-interactions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the locally audited patch and exact source allowlist
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,io,lzma,pathlib,subprocess,json
          raw=b''.join(pathlib.Path(f'.interaction-part{i}').read_bytes() for i in (1,2))
          assert len(raw)==11092
          assert hashlib.sha256(raw).hexdigest()=='60f44a67bb2677678756175c154b860fd4fa9eccde03c68f1bcb24011e3f974f'
          with lzma.LZMAFile(io.BytesIO(raw)) as stream:patch=stream.read(38075)
          assert len(patch)==38074
          assert hashlib.sha256(patch).hexdigest()=='51b2d9560f19f538373d1b5aa8b15f1fc26b450c8d5db47c9bb02fa6d3ef4842'
          p=pathlib.Path('/tmp/body-interactions.patch');p.write_bytes(patch)
          allowed={'ku100sim/unified.py','native/unified/engine.cpp','scripts/render_unified.py','scenes/interactions/opposed-grip.json','scenes/unified/silicone-sweep.json','tests/test_interactions.py','scripts/check_interaction_stage.py'}
          paths={line.split('\t')[-1] for line in subprocess.check_output(['git','apply','--numstat',str(p)],text=True).splitlines()}
          assert paths==allowed
          subprocess.run(['git','apply','--check','--index',str(p)],check=True)
          subprocess.run(['git','apply','--index',str(p)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          pathlib.Path('/tmp/body-interaction-paths.json').write_text(json.dumps(sorted(allowed)))
          PY
          git rm .interaction-part1 .interaction-part2 .github/workflows/check-body-interactions.yml
          mkdir -p validation/local/body-interactions
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install original numerical dependencies and verify the existing receiver
        run: |
          python -m pip install -r requirements.txt
          python scripts/prepare_ku100.py --download
      - name: Run all focused mechanics, receiver and publication regressions
        run: |
          set -euo pipefail
          python -m unittest tests.test_interactions tests.test_unified tests.test_binaural tests.test_unified_publication -v 2>&1 | tee validation/local/body-interactions/tests.txt
      - name: Check full grip trajectories, action/reaction and time refinement
        run: python scripts/check_interaction_stage.py --out validation/local/body-interactions/check
      - name: Store exact tested source blobs without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,subprocess,base64
          rows=[]
          for name in json.loads(pathlib.Path('/tmp/body-interaction-paths.json').read_text()):
              content=pathlib.Path(name).read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              payload=json.dumps({'content':base64.b64encode(content).decode(),'encoding':'base64'})
              result=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/parafieldai/Ku100-Sim/git/blobs','--input','-'],input=payload,text=True))
              assert result['sha']==expected
              rows.append({'path':name,'mode':'100644','type':'blob','sha':expected,'sha256':hashlib.sha256(content).hexdigest(),'bytes':len(content)})
          pathlib.Path('validation/local/body-interactions/blobs.json').write_text(json.dumps({'base_commit':'56275aa5fc39a0ae1defa26fb4c263f64147926d','files':rows,'refs_changed':False,'new_audio_published':False},indent=2)+'\n')
          print(json.dumps(rows))
          PY
      - name: Preserve exact staged source
        if: always()
        run: |
          mkdir -p validation/local/body-interactions/source
          tree=$(git write-tree)
          git archive --format=tar "$tree" > validation/local/body-interactions/source/source.tar
          echo "$tree" > validation/local/body-interactions/source/tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: body-interactions-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: validation/local/body-interactions/
