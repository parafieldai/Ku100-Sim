name: Validate main quality change
on:
  push:
    branches: [research-audio-quality]
    paths: ['.research-quality-part05']
  workflow_dispatch:
permissions:
  contents: write
  pages: read
concurrency:
  group: research-quality-publication
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'parafieldai/Ku100-Sim' && github.ref == 'refs/heads/research-audio-quality'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify and apply the exact source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, io, lzma, pathlib, subprocess
          encoded=''.join(pathlib.Path(f'.research-quality-part{i:02}').read_text().strip() for i in range(1,6))
          raw=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(raw).hexdigest()=='511e6430f2678f47eee11a2f9365938638f6a7a367f6e080785088edd05fe041'
          with lzma.LZMAFile(io.BytesIO(raw)) as stream: patch=stream.read(89282)
          assert len(patch)==89281
          assert hashlib.sha256(patch).hexdigest()=='ad635e54f13e9b7123c793295365a3731d6f1df5d15afa8a63da2858cd533206'
          target=pathlib.Path('/tmp/main-quality.patch');target.write_bytes(patch)
          allowed={'README.md','docs/DATASET_RESEARCH.md','docs/QUALITY_UPDATE.md','docs/VISCOUS_LOSSES.md','ku100sim/audio.py','ku100sim/scene.py','native/main.cpp','native/physics.cpp','native/physics.hpp','native/viscous.hpp','scenes/fine-texture-left.json','scenes/unsteady-stroke-left.json','scripts/browser_e2e.mjs','scripts/browser_offline.mjs','scripts/generate_examples.py','scripts/package_preview.py','scripts/quality_gate.py','scripts/summarize_paired_trial.py','scripts/validate_physics.py','scripts/validate_viscous.py','tests/quality_probe.cpp','tests/test_quality_gate.py','tests/test_viscous.py','validation/dataset-paired-trial.json','web/app.js','web/core.js','web/examples/index.json','web/index.html','web/tests/core.test.js'}
          paths={line.split('\t')[-1] for line in subprocess.check_output(['git','apply','--numstat',str(target)],text=True).splitlines()}
          assert paths==allowed
          subprocess.run(['git','apply','--check','--index',str(target)],check=True)
          subprocess.run(['git','apply','--index',str(target)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          git config user.name 'Parafield Team'
          git config user.email 'team@parafield.ai'
          git commit -m 'Add passive unsteady tube losses, band-wise convergence assessment and native audio previews'
          mkdir -p validation/local
          git rev-parse HEAD > validation/local/tested-commit.txt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned numerical and browser dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix web
          npx --prefix web playwright install --with-deps chromium
      - name: Build and validate the native renderer
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_native.py
          python scripts/prepare_ku100.py --download
          python -m unittest discover -s tests -v 2>&1 | tee validation/local/native-tests.txt
          npm --prefix web test 2>&1 | tee validation/local/frontend-tests.txt
          python scripts/validate_physics.py --out validation/local/physics-convergence.json
          python scripts/validate_viscous.py
          python scripts/quality_gate.py
      - name: Generate and test real audio over HTTP and from the offline file
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_examples.py
          npm --prefix web run check:examples
          python scripts/build_site.py
          node scripts/browser_e2e.mjs
          python scripts/package_preview.py --out outputs/review
          node scripts/browser_offline.mjs
      - name: Record actual Pages availability without changing privacy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p validation/local
          gh api "repos/${GITHUB_REPOSITORY}/pages" > validation/local/pages.json 2> validation/local/pages-error.txt || true
      - name: Publish tested code to the research branch without force
        run: git push origin HEAD:refs/heads/research-audio-quality
      - name: Retain exact source and reviewable patch
        if: always()
        run: |
          mkdir -p validation/local/source
          git archive --format=tar HEAD > validation/local/source/source.tar
          git bundle create validation/local/source/source.bundle --all HEAD
          if test -f /tmp/main-quality.patch; then cp /tmp/main-quality.patch validation/local/source/main-quality.patch; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-quality-preview-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/
            outputs/review/
            validation/local/
            build/ku100-native.build.json
