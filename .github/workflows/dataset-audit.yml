name: Public dataset audit
on:
  push:
    branches: [research-audio-quality]
    paths: ['.github/workflows/dataset-audit.yml', 'scripts/audit_datasets.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install soundfile==0.13.1
      - name: Inspect sources, recording exact access status and byte hashes
        run: python scripts/audit_datasets.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-data-audit-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: validation/local/dataset-audit/
