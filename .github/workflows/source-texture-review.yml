name: Validate source texture iteration
on:
  push:
    branches: [source-texture-review]
    paths: ['.source-part2']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-texture-review
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'parafieldai/Ku100-Sim' && github.ref == 'refs/heads/source-texture-review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify exact source patch and apply only the declared paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, io, lzma, pathlib, subprocess
          raw=b''.join(pathlib.Path(f'.source-part{i}').read_bytes() for i in (1,2))
          assert len(raw)==27180
          assert hashlib.sha256(raw).hexdigest()=='029ddaeefb007a77e4ea15ece63c274b4df263e5b0cf013baf91b44b930b4652'
          with lzma.LZMAFile(io.BytesIO(raw)) as stream: patch=stream.read(89056)
          assert len(patch)==89055
          assert hashlib.sha256(patch).hexdigest()=='e2288c657c30c21538659de460df00ba2f3c6a01a1e9c7883630a44e0b7f75ba'
          p=pathlib.Path('/tmp/source-iteration.patch');p.write_bytes(patch)
          allowed={'.gitignore','ku100sim/texture_source.py','scripts/fit_texture_source.py','scripts/build_texture_iteration.py','scripts/assess_texture_iteration.py','scripts/texture_publication.py','scripts/browser_source.mjs','tests/test_texture_source.py','tests/test_source_publication.py','requirements-texture.txt','web/source/index.html','web/source/app.js','web/source/style.css','docs/target/SOURCE_ITERATION.md','scripts/build_site.py','scripts/browser_saved_listening.mjs','web/index.html','web/target/index.html','web/target/app.js'}
          actual={r.split('\t')[-1] for r in subprocess.check_output(['git','apply','--numstat',str(p)],text=True).splitlines()}
          assert actual==allowed
          subprocess.run(['git','apply','--check','--index',str(p)],check=True)
          subprocess.run(['git','apply','--index',str(p)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          git rm .source-part1 .source-part2
          git config user.name 'Parafield Team'
          git config user.email 'team@parafield.ai'
          git commit -m 'Implement multiscale source-texture experiment and stable listening comparisons'
          mkdir -p validation/local/source-review
          git rev-parse HEAD > validation/local/source-review/tested-commit.txt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install numerical, CPU optimization and locked browser dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-texture.txt
          npm ci --prefix web
          npx --prefix web playwright install --with-deps chromium
      - name: Verify preserved native sources and new texture contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_native.py
          python scripts/prepare_ku100.py --download
          python -m unittest discover -s tests -v 2>&1 | tee validation/local/source-review/python-tests.txt
          npm --prefix web test 2>&1 | tee validation/local/source-review/frontend-tests.txt
          python scripts/check_research_index.py
          python scripts/validate_physics.py --out validation/local/physics-convergence.json
          python scripts/validate_viscous.py
          python scripts/quality_gate.py
          python scripts/validate_release.py
      - name: Generate new source textures and retained comparisons without reading recordings
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_examples.py
          python scripts/build_target_study.py
          python scripts/assess_target_study.py
          python scripts/build_texture_iteration.py
          python scripts/assess_texture_iteration.py
          npm --prefix web run check:examples
          python scripts/build_site.py
      - name: Test audio playback, stable identities, mono isolation and local-only reference handling
        shell: bash
        run: |
          set -euo pipefail
          node scripts/browser_e2e.mjs
          python scripts/package_preview.py --out outputs/review
          node scripts/browser_offline.mjs
          node scripts/browser_target.mjs
          KU100_TARGET_URL="file://${GITHUB_WORKSPACE}/outputs/review/target.html" KU100_TARGET_REPORT_DIR=validation/local/target-offline node scripts/browser_target.mjs
          node scripts/browser_saved_listening.mjs
          node scripts/browser_source.mjs
      - name: Publish tested expanded code without force or workflow modification
        run: git push origin HEAD:refs/heads/source-texture-review
      - name: Preserve exact source and review evidence
        if: always()
        run: |
          mkdir -p validation/local/source-review/source
          git archive --format=tar HEAD > validation/local/source-review/source/source.tar
          git bundle create validation/local/source-review/source/source.bundle --all HEAD
          git rev-parse HEAD > validation/local/source-review/source/commit.txt
          if test -f /tmp/source-iteration.patch; then cp /tmp/source-iteration.patch validation/local/source-review/source/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-texture-review-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/
            outputs/review/
            validation/local/
            build/ku100-native.build.json
