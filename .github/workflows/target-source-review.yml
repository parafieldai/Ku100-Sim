name: Validate target-source investigation
on:
  push:
    branches: [target-source-review]
    paths: ['.target-part7', '.github/workflows/target-source-review.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: target-source-investigation
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'parafieldai/Ku100-Sim' && github.ref == 'refs/heads/target-source-review' && !contains(github.event.head_commit.message, '[expanded-source]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify source patch identity and exact publication allowlist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, io, lzma, pathlib, subprocess
          raw=b''.join(pathlib.Path(f'.target-part{i}').read_bytes() for i in range(1,8))
          assert len(raw)==41536
          assert hashlib.sha256(raw).hexdigest()=='38d2855f06501c2ae67a6f43a0281eb4b86b069ebaf33d0b3ede2299449f6b61'
          with lzma.LZMAFile(io.BytesIO(raw)) as f: patch=f.read(149774)
          assert len(patch)==149773
          assert hashlib.sha256(patch).hexdigest()=='9493cc6b0fd01c32a61d5526e77e3161d8a276a51cfedc6a63be006f3af28a8e'
          p=pathlib.Path('/tmp/target-source.patch');p.write_bytes(patch)
          allowed={'docs/SFX_TRIGGER_RESEARCH.md','docs/TARGET_REFOCUS.md','native/release.hpp','native/release_main.cpp','scripts/browser_target.mjs','scripts/build_release.py','scripts/package_target.py','scripts/target_study.py','scripts/validate_release.py','tests/release_probe.cpp','tests/test_release_source.py','tests/test_target_publication.py','validation/targets/release-validation.json','validation/targets/source-study.json','web/target-reference-summary.json','web/target.css','web/target.html','web/target.js','web/triggers.json','.gitignore','CMakeLists.txt','README.md','scripts/build_site.py','scripts/generate_examples.py','scripts/package_preview.py','web/index.html'}
          paths={r.split('\t')[-1] for r in subprocess.check_output(['git','apply','--numstat',str(p)],text=True).splitlines()}
          assert paths==allowed
          subprocess.run(['git','apply','--check','--index',str(p)],check=True)
          subprocess.run(['git','apply','--index',str(p)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          git rm .target-part1 .target-part2 .target-part3 .target-part4 .target-part5 .target-part6 .target-part7
          git config user.name 'Parafield Team'
          git config user.email 'team@parafield.ai'
          git commit -m 'Implement target comparison, source-discrimination probe and SFX research [expanded-source]'
          mkdir -p validation/local/target-review
          git rev-parse HEAD > validation/local/target-review/tested-commit.txt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install declared numerical and locked browser dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix web
          npx --prefix web playwright install --with-deps chromium
      - name: Verify original and new native source models
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_native.py
          python scripts/prepare_ku100.py --download
          python -m unittest discover -s tests -v 2>&1 | tee validation/local/target-review/native-tests.txt
          npm --prefix web test 2>&1 | tee validation/local/target-review/frontend-tests.txt
          python scripts/check_research_index.py
          python scripts/validate_physics.py --out validation/local/physics-convergence.json
          python scripts/validate_viscous.py
          python scripts/quality_gate.py
          python scripts/validate_release.py
      - name: Generate both experiment families and test existing viewer
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_examples.py
          npm --prefix web run check:examples
          python scripts/build_site.py
          node scripts/browser_e2e.mjs
          python scripts/package_preview.py --out outputs/review
          node scripts/browser_offline.mjs
      - name: Verify target comparison over HTTP
        run: node scripts/browser_target.mjs
      - name: Verify server-free target comparison and local-only reference handling
        env:
          KU100_TARGET_URL: file://${{ github.workspace }}/outputs/review/target.html
          KU100_TARGET_REPORT_DIR: validation/local/target-offline
        run: node scripts/browser_target.mjs
      - name: Publish tested source only, without changing workflows
        run: git push origin HEAD:refs/heads/target-source-review
      - name: Preserve exact source and patch without credentials
        if: always()
        run: |
          mkdir -p validation/local/target-review/source
          git archive --format=tar HEAD > validation/local/target-review/source/source.tar
          git bundle create validation/local/target-review/source/source.bundle --all HEAD
          git rev-parse HEAD > validation/local/target-review/source/commit.txt
          if test -f /tmp/target-source.patch; then cp /tmp/target-source.patch validation/local/target-review/source/target-source.patch; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-source-review-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/
            outputs/review/
            validation/local/
            build/ku100-native.build.json
