name: Validate object experiment
on:
  push:
    branches: [sfx-object-validation]
    paths: ['.object-part4', '.github/workflows/apply-object-experiment.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: object-experiment-validation
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'parafieldai/Ku100-Sim' && github.ref == 'refs/heads/sfx-object-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact tested source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, io, lzma, pathlib, subprocess
          raw=b''.join(pathlib.Path(f'.object-part{i}').read_bytes() for i in range(1,5))
          assert len(raw)==34772
          assert hashlib.sha256(raw).hexdigest()=='1089765b80dedefb278c42a7bf4905eb712a70a5590e01bbb51b2abcefdc8609'
          with lzma.LZMAFile(io.BytesIO(raw)) as stream:patch=stream.read(151333)
          assert len(patch)==151332
          assert hashlib.sha256(patch).hexdigest()=='982bb647e50da30f6d276d914f0ea78340fe46f4a51387d18448440cd83fcb85'
          path=pathlib.Path('/tmp/object-experiment.patch');path.write_bytes(patch)
          allowed={'.github/workflows/ci.yml','.github/workflows/verify-live-pages.yml','.gitignore','docs/RESEARCH_INDEX.md','docs/objects/RESEARCH.md','docs/objects/VALIDATION.md','ku100sim/modal_object.py','models/object-profiles/27_WoodPlate.json','models/object-profiles/64_CeramicMug.json','models/object-profiles/94_GlassGoblet.json','scripts/acquire_impact_subset.py','scripts/browser_objects.mjs','scripts/build_object_examples.py','scripts/fit_object_models.py','scripts/object_publication.py','scripts/package_object_site.py','tests/test_modal_object.py','tests/test_object_publication.py','validation/objects/assessment.json','validation/objects/data-receipt.json','validation/objects/initial-modal-only.json','web/objects/app.js','web/objects/index.html','web/objects/style.css','web/source/index.html'}
          paths={line.split('\t')[-1] for line in subprocess.check_output(['git','apply','--numstat',str(path)],text=True).splitlines()}
          assert paths==allowed
          subprocess.run(['git','apply','--check','--index',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          git rm .object-part1 .object-part2 .object-part3 .object-part4 .github/workflows/apply-object-experiment.yml
          mkdir -p validation/local/object-validation
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-texture.txt
          npm ci --prefix web
          npx --prefix web playwright install --with-deps chromium
      - name: Main and object model regression tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_native.py
          python scripts/prepare_ku100.py --download
          python -m unittest discover -s tests -v 2>&1 | tee validation/local/object-validation/tests.txt
          npm --prefix web test
          python scripts/check_research_index.py
      - name: Recover unchanged generated prerequisites from verified main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/parafieldai/Ku100-Sim/actions/runs/36673396033 > validation/local/object-validation/baseline-run.json
          jq -e '.head_sha == "1020d45505c9dace5ed7b0c4fa2e1883e8b99294" and .conclusion == "success"' validation/local/object-validation/baseline-run.json
          gh run download 36673396033 --repo "$GITHUB_REPOSITORY" --name ku100-verified-1020d45505c9dace5ed7b0c4fa2e1883e8b99294 --dir baseline
          python - <<'PY'
          import pathlib,shutil
          root=pathlib.Path('baseline/dist')
          for p in root.rglob('*'):
              if p.is_file():
                  name=p.relative_to(root).as_posix()
                  if name.startswith(('examples/','target/generated/','source/generated/','long/generated/')) or name=='target-study.json':
                      target=pathlib.Path('web')/name
                      if not target.exists():target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,target)
          PY
      - name: Generate and verify new object audio
        run: |
          python scripts/build_object_examples.py
          python scripts/package_object_site.py
          node scripts/browser_objects.mjs
      - name: Save expanded Git objects for authorized integration, without updating any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess,urllib.request
          root='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def api(path,data=None):
              req=urllib.request.Request(root+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          parent=os.environ['GITHUB_SHA'];base=api('/git/commits/'+parent)['tree']['sha']
          names=subprocess.check_output(['git','diff','--cached','--name-status','-z']).decode().split('\0')
          entries=[]
          for i in range(0,len(names)-1,2):
              status,name=names[i:i+2];row={'path':name,'mode':'100644','type':'blob'}
              if status=='D':row['sha']=None
              else:row['content']=pathlib.Path(name).read_text()
              entries.append(row)
          tree=api('/git/trees',{'base_tree':base,'tree':entries})['sha']
          expected=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree==expected,(tree,expected)
          commit=api('/git/commits',{'message':'Add tested data-assisted wood, ceramic and glass impact models and generated listening page','tree':tree,'parents':[parent]})['sha']
          report={'tested_tree_sha':tree,'commit_sha':commit,'transport_parent':parent,'refs_updated_by_workflow':False,'new_examples_generated':9,'source_recordings_published':False}
          pathlib.Path('validation/local/object-validation/source-identity.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          PY
      - name: Preserve expanded source, not temporary transport files
        if: always()
        run: |
          mkdir -p validation/local/object-validation/source
          tree=$(git write-tree)
          git archive --format=tar "$tree" > validation/local/object-validation/source/source.tar
          cp /tmp/object-experiment.patch validation/local/object-validation/source/changes.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: object-experiment-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/objects/
            validation/local/object-browser/
            validation/local/object-validation/
