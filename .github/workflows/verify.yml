name: Native verification
on:
  push:
    branches: [main, native-physics-audit]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2
      - run: python tests/verify.py
      - run: python tools/sphere.py
      - name: Native address and undefined-behavior sanitizers
        run: |
          clang++ -O1 -g -std=c++17 -fsanitize=address,undefined -fno-omit-frame-pointer tests/dsp.cpp -o build/dsp_sanitized
          ASAN_OPTIONS=detect_leaks=1 ./build/dsp_sanitized | tee research/native-sanitizer.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-verification
          path: research/
