name: Publish viewer
on:
  workflow_run:
    workflows: [Validate native renderer and viewer]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main-branch native CI run ID
        required: true
permissions:
  contents: read
  actions: read
  pages: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.site.outputs.ready }}
    steps:
      - name: Verify the source run and Pages availability
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID" > run.json
          jq -e --arg repo "$GITHUB_REPOSITORY" '.conclusion == "success" and .head_branch == "main" and .path == ".github/workflows/ci.yml" and .head_repository.full_name == $repo' run.json
          sha=$(jq -r '.head_sha' run.json)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run=$RUN_ID" >> "$GITHUB_OUTPUT"
          if gh api "repos/${GITHUB_REPOSITORY}/pages" > pages.json 2> pages-error.txt; then
            if jq -e '.build_type == "workflow"' pages.json; then
              echo 'ready=true' >> "$GITHUB_OUTPUT"
            else
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              echo 'Configure Settings > Pages > GitHub Actions. The downloadable preview remains in the successful CI artifact.' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Pages is not enabled or not accessible to this workflow. No live site is claimed. Open the native CI artifact for the offline HTML and WAVs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v4
        if: steps.site.outputs.ready == 'true'
        with:
          name: ku100-verified-${{ steps.site.outputs.sha }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.site.outputs.run }}
          path: tested
      - uses: actions/configure-pages@v5
        if: steps.site.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.site.outputs.ready == 'true'
        with:
          path: tested/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-availability-${{ github.run_id }}
          path: |
            pages.json
            pages-error.txt
            run.json
  deploy:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
