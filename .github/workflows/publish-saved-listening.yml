name: Validate saved listening publication
on:
  push:
    branches: [publish-saved-listening]
    paths: ['.saved-part12', '.github/workflows/publish-saved-listening.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saved-listening-publication
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'parafieldai/Ku100-Sim' && github.ref == 'refs/heads/publish-saved-listening' && !contains(github.event.head_commit.message, '[expanded-source]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify and apply the exact public-safe integration patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, io, lzma, pathlib, subprocess
          raw=b''.join(pathlib.Path(f'.saved-part{i:02}').read_bytes() for i in range(1,13))
          assert len(raw)==67544
          assert hashlib.sha256(raw).hexdigest()=='4d9314d775054ff1f52664961deee5f2f69b99cfd4ce755573f35c7fcdba7297'
          with lzma.LZMAFile(io.BytesIO(raw)) as stream: patch=stream.read(250138)
          assert len(patch)==250137
          assert hashlib.sha256(patch).hexdigest()=='055efd2627cf7f77c811187ba0b77e9a0731aaaf851b6ed56e5a6499408e2fa3'
          path=pathlib.Path('/tmp/saved-listening.patch');path.write_bytes(patch)
          allowed={'.gitignore','docs/target/DELIVERY.md','docs/target/EMPIRICAL_BURST_EXPERIMENT.md','docs/target/LOCAL_RESULTS.md','docs/target/PUBLISHING.md','docs/target/SFX_TRIGGER_RESEARCH.md','docs/target/TARGET_RESET.md','ku100sim/burst_source.py','ku100sim/target_metrics.py','models/burst-left.json','models/burst-right.json','research/target/triggers.json','scenes/target-baseline-left.json','scenes/target-baseline-right.json','scripts/analyze_target_references.py','scripts/assess_target_study.py','scripts/browser_saved_listening.mjs','scripts/browser_target_live.mjs','scripts/build_site.py','scripts/build_target_study.py','scripts/fit_burst_source.py','scripts/package_preview.py','scripts/package_target_preview.py','scripts/render_burst_source.py','tests/test_burst_source.py','tests/test_saved_listening_publication.py','validation/target/browser-file-blocked.json','validation/target/browser-http-blocked.json','validation/target/browser-memory.json','validation/target/local-audit.json','validation/target/reference-targets.json','validation/target/required-target-gate.log','validation/target/target-full-python.log','validation/target/target-js-tests-final.log','validation/target/target-readiness.json','web/index.html','web/target.html','web/target/app.js','web/target/core.js','web/target/index.html','web/target/style.css','web/tests/target.test.js'}
          changed={line.split('\t')[-1] for line in subprocess.check_output(['git','apply','--numstat',str(path)],text=True).splitlines()}
          assert changed==allowed
          subprocess.run(['git','apply','--check','--index',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          git rm .saved-part01 .saved-part02 .saved-part03 .saved-part04 .saved-part05 .saved-part06 .saved-part07 .saved-part08 .saved-part09 .saved-part10 .saved-part11 .saved-part12
          git config user.name 'Parafield Team'
          git config user.email 'team@parafield.ai'
          git commit -m '[expanded-source] Preserve newer main and integrate saved generated-audio comparison'
          mkdir -p validation/local/saved-publication
          git rev-parse HEAD > validation/local/saved-publication/tested-commit.txt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install numerical and locked browser dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix web
          npx --prefix web playwright install --with-deps chromium
      - name: Build and verify all preserved and added sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_native.py
          python scripts/prepare_ku100.py --download
          python -m unittest discover -s tests -v 2>&1 | tee validation/local/saved-publication/python-tests.txt
          npm --prefix web test 2>&1 | tee validation/local/saved-publication/frontend-tests.txt
          python scripts/check_research_index.py
          python scripts/validate_physics.py --out validation/local/physics-convergence.json
          python scripts/validate_viscous.py
          python scripts/quality_gate.py
          python scripts/validate_release.py
      - name: Generate public-only demonstrations and retain target failures
        run: |
          python scripts/generate_examples.py
          python scripts/build_target_study.py
          python scripts/assess_target_study.py
          npm --prefix web run check:examples
          python scripts/build_site.py
      - name: Test rendered audio and both comparison pages over HTTP and offline
        run: |
          node scripts/browser_e2e.mjs
          python scripts/package_preview.py --out outputs/review
          node scripts/browser_offline.mjs
          node scripts/browser_target.mjs
          KU100_TARGET_URL="file://${GITHUB_WORKSPACE}/outputs/review/target.html" KU100_TARGET_REPORT_DIR=validation/local/target-offline node scripts/browser_target.mjs
          node scripts/browser_saved_listening.mjs
      - name: Publish expanded tested sources without force or workflow mutation
        run: git push origin HEAD:refs/heads/publish-saved-listening
      - name: Retain exact source and integration patch
        if: always()
        run: |
          mkdir -p validation/local/saved-publication/source
          git archive --format=tar HEAD > validation/local/saved-publication/source/source.tar
          git bundle create validation/local/saved-publication/source/source.bundle --all HEAD
          git rev-parse HEAD > validation/local/saved-publication/source/commit.txt
          if test -f /tmp/saved-listening.patch; then cp /tmp/saved-listening.patch validation/local/saved-publication/source/integration.patch; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-listening-review-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/
            outputs/review/
            validation/local/
            build/ku100-native.build.json
