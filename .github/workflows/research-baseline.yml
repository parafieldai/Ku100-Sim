name: Research baseline
on:
  push:
    branches: [research-audio-quality]
    paths: ['.github/workflows/research-baseline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Retain tracked source and Git history without credentials
        run: |
          mkdir -p research-export
          git archive --format=tar HEAD > research-export/source.tar
          git bundle create research-export/source.bundle --all
          git rev-parse HEAD > research-export/commit.txt
          sha256sum research-export/source.tar > research-export/source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          retention-days: 7
          path: research-export/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Build and verify baseline
        run: |
          python scripts/build_native.py
          python scripts/prepare_ku100.py --download
          python -m unittest discover -s tests -v
      - name: Retain measured bank and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ github.sha }}
          retention-days: 7
          path: |
            data/ku100_bank.bin
            build/ku100-native.build.json
            validation/local/
