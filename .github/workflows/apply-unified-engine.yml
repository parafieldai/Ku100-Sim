name: Validate shared mechanical engine
on:
  push:
    branches: [shared-mechanics-core]
    paths: ['.unified-part4', '.github/workflows/apply-unified-engine.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: shared-engine-validation
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'parafieldai/Ku100-Sim' && github.ref == 'refs/heads/shared-mechanics-core'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and apply the exact locally tested source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,io,json,lzma,pathlib,subprocess
          raw=b''.join(pathlib.Path(f'.unified-part{i}').read_bytes() for i in range(1,5))
          assert len(raw)==28668
          assert hashlib.sha256(raw).hexdigest()=='ee4b61cd68cac9af504c2379fbe7dfcfa703db88926ec69594edfb5462cffa10'
          with lzma.LZMAFile(io.BytesIO(raw)) as stream:patch=stream.read(123187)
          assert len(patch)==123186
          assert hashlib.sha256(patch).hexdigest()=='e9e3ad81b386853c2364199837f81ac89df477a2b96918f08b27cfc692f1868f'
          path=pathlib.Path('/tmp/shared-engine.patch');path.write_bytes(patch)
          allowed={'.github/workflows/ci.yml','.github/workflows/verify-live-pages.yml','.gitignore','docs/engine-rebuild/UNIFIED_ENGINE.md','ku100sim/unified.py','native/unified/engine.cpp','scenes/unified/fork-256.json','scenes/unified/fork-512.json','scenes/unified/fork-damped.json','scenes/unified/plastic-slow.json','scenes/unified/plastic-snap.json','scenes/unified/silicone-hold.json','scenes/unified/silicone-sweep.json','scripts/browser_unified.mjs','scripts/build_unified_examples.py','scripts/package_unified_site.py','scripts/render_unified.py','scripts/validate_unified.py','tests/test_unified.py','tests/test_unified_publication.py','web/source/index.html','web/source/style.css','web/unified/app.js','web/unified/index.html','web/unified/style.css'}
          paths={line.split('\t')[-1] for line in subprocess.check_output(['git','apply','--numstat',str(path)],text=True).splitlines()}
          assert paths==allowed
          pathlib.Path('/tmp/shared-paths.json').write_text(json.dumps(sorted(allowed)))
          subprocess.run(['git','apply','--check','--index',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          git rm .unified-part1 .unified-part2 .unified-part3 .unified-part4 .github/workflows/apply-unified-engine.yml
          mkdir -p validation/local/shared-engine
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install numerical and browser dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-texture.txt
          npm ci --prefix web
          npx --prefix web playwright install --with-deps chromium
      - name: Native regression, shared equations and documentation checks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_native.py
          python scripts/prepare_ku100.py --download
          python -m unittest discover -s tests -v 2>&1 | tee validation/local/shared-engine/tests.txt
          npm --prefix web test 2>&1 | tee validation/local/shared-engine/frontend.txt
          python scripts/check_research_index.py
          python scripts/validate_unified.py
      - name: Recover only unchanged generated prerequisites from verified main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/parafieldai/Ku100-Sim/actions/runs/36731857656 > validation/local/shared-engine/baseline-run.json
          jq -e '.head_sha == "c4ef705ca0924c24915a445e1b40a5efc83dcf68" and .conclusion == "success"' validation/local/shared-engine/baseline-run.json
          gh run download 36731857656 --repo "$GITHUB_REPOSITORY" --name ku100-verified-c4ef705ca0924c24915a445e1b40a5efc83dcf68 --dir baseline
          python - <<'PY'
          import pathlib,shutil
          root=pathlib.Path('baseline/dist')
          for p in root.rglob('*'):
              if p.is_file():
                  name=p.relative_to(root).as_posix()
                  if name.startswith(('examples/','target/generated/','source/generated/','long/generated/','objects/generated/')) or name=='target-study.json':
                      target=pathlib.Path('web')/name
                      if not target.exists():target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,target)
          PY
      - name: Generate seven scenes with one engine and test the public-style path
        run: |
          python scripts/build_unified_examples.py
          python scripts/package_unified_site.py
          node scripts/browser_unified.mjs
          node scripts/browser_source.mjs
      - name: Save verified changed-source blobs without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,pathlib,subprocess
          rows=[]
          for name in json.loads(pathlib.Path('/tmp/shared-paths.json').read_text()):
              content=pathlib.Path(name).read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              payload=json.dumps({'content':base64.b64encode(content).decode(),'encoding':'base64'})
              j=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/parafieldai/Ku100-Sim/git/blobs','--input','-'],input=payload,text=True))
              assert j['sha']==expected
              rows.append({'path':name,'mode':'100644','type':'blob','sha':expected,'bytes':len(content),'sha256':hashlib.sha256(content).hexdigest()})
          out=pathlib.Path('validation/local/shared-engine/blobs.json')
          out.write_text(json.dumps({'base_commit':'c4ef705ca0924c24915a445e1b40a5efc83dcf68','tested_tree':subprocess.check_output(['git','write-tree'],text=True).strip(),'refs_changed':False,'files':rows},indent=2)+'\n')
          PY
      - name: Preserve exact expanded source and physics evidence
        if: always()
        run: |
          mkdir -p validation/local/shared-engine/source
          git archive --format=tar "$(git write-tree)" > validation/local/shared-engine/source/source.tar
          cp /tmp/shared-engine.patch validation/local/shared-engine/source/changes.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-engine-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/unified/
            validation/local/shared-engine/
            validation/local/unified-validation.json
            validation/local/unified-browser/
            validation/local/source-browser/
