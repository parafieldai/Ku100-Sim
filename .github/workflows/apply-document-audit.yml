name: Validate document-to-code audit
on:
  push:
    branches: [merge-documentation-audit]
    paths: ['.audit-part4']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: document-audit-publication
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'parafieldai/Ku100-Sim' && github.ref == 'refs/heads/merge-documentation-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify exact patch identity and document/code path allowlist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, io, lzma, pathlib, subprocess
          raw=b''.join(pathlib.Path(f'.audit-part{i}').read_bytes() for i in range(1,5))
          assert len(raw)==25740
          assert hashlib.sha256(raw).hexdigest()=='0342942969c8d86cd3b965e381f638b1bbf9ff01433577703ecbf7de4eaf8896'
          with lzma.LZMAFile(io.BytesIO(raw)) as stream: patch=stream.read(97882)
          assert len(patch)==97881
          assert hashlib.sha256(patch).hexdigest()=='b2863228dffa98ce8cd7808ebdae82f1905de9049d5ef8838e71f16c402b7ad8'
          path=pathlib.Path('/tmp/document-audit.patch'); path.write_bytes(patch)
          allowed={'.github/workflows/ci.yml','README.md','docs/IMPLEMENTATION_AUDIT.md','docs/PHYSICS.md','docs/RESEARCH_INDEX.md','docs/reports/main-quality-update-2026-09-29.md','ku100sim/audio.py','ku100sim/scene.py','scripts/build_site.py','scripts/check_research_index.py','tests/test_document_contracts.py','validation/audits/2026-09-29/audit-results.json','validation/reports/2026-09-29-quality/PUBLICATION.json','validation/reports/2026-09-29-quality/dataset-paired-trial.json','validation/reports/2026-09-29-quality/e2e.json','validation/reports/2026-09-29-quality/example-summary.json','validation/reports/2026-09-29-quality/manifest.json','validation/reports/2026-09-29-quality/quality-assessment.json','validation/reports/2026-09-29-quality/viscous-validation.json','web/core.js','web/tests/core.test.js'}
          paths={line.split('\t')[-1] for line in subprocess.check_output(['git','apply','--numstat',str(path)],text=True).splitlines()}
          assert paths==allowed
          subprocess.run(['git','apply','--check','--index',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          git rm .audit-part1 .audit-part2 .audit-part3 .audit-part4 .github/workflows/apply-document-audit.yml
          git config user.name 'Parafield Team'
          git config user.email 'team@parafield.ai'
          git commit -m 'Audit document contracts, fix malformed input handling and preserve research evidence'
          mkdir -p validation/local/document-audit
          git rev-parse HEAD > validation/local/document-audit/tested-commit.txt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install declared numerical and browser dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix web
          npx --prefix web playwright install --with-deps chromium
      - name: Native and document contract audits
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_native.py
          python scripts/prepare_ku100.py --download
          python -m unittest discover -s tests -v 2>&1 | tee validation/local/document-audit/native-tests.txt
          npm --prefix web test 2>&1 | tee validation/local/document-audit/frontend-tests.txt
          python scripts/check_research_index.py | tee validation/local/document-audit/document-index.txt
          python scripts/validate_physics.py --out validation/local/physics-convergence.json
          python scripts/validate_viscous.py
          python scripts/quality_gate.py
      - name: Verify isolated benchmark without substituting it for main
        shell: bash
        run: |
          set -euo pipefail
          cd benchmarks/contact-coupon
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          python tests/verify.py 2>&1 | tee ../../validation/local/document-audit/benchmark-tests.txt
          python tools/compare_receivers.py
          python tools/sphere.py
      - name: Test exact rendered output over HTTP and offline
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_examples.py
          npm --prefix web run check:examples
          python scripts/build_site.py
          node scripts/browser_e2e.mjs
          python scripts/package_preview.py --out outputs/review
          node scripts/browser_offline.mjs
      - name: Publish tested expanded sources without force
        run: git push origin HEAD:refs/heads/merge-documentation-audit
      - name: Preserve exact tested source and branch ancestry
        if: always()
        run: |
          mkdir -p validation/local/document-audit/source
          git archive --format=tar HEAD > validation/local/document-audit/source/source.tar
          git bundle create validation/local/document-audit/source/source.bundle --all HEAD
          git rev-parse HEAD > validation/local/document-audit/source/commit.txt
          git for-each-ref --format='%(refname) %(objectname)' > validation/local/document-audit/source/refs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ku100-document-audit-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/
            outputs/review/
            validation/local/
            build/ku100-native.build.json
            benchmarks/contact-coupon/research/verification.json
            benchmarks/contact-coupon/research/receivers.json
            benchmarks/contact-coupon/research/sphere.json
